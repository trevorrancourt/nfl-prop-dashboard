name: Look back on a week

# Manual only (2026-11-03, per Trevor: "can you do a look back on last
# week"). Replays the boards saved during a finished week (the "Archive this
# build" artifacts from update.yml) with the current page code, grades every
# row against the real box scores, and posts the summary as notes on the run.
# Pulls no odds, so it costs no Odds API credits.
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week to grade (leave blank for the last finished week)"
        required: false
      study_weeks:
        description: "Instead of grading: run the real-line study over these weeks, e.g. 7 8 9 (scripts/real_line_study.py)"
        required: false

permissions:
  contents: read
  actions: read

jobs:
  lookback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/Denver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 2026-11-11: the --with-deps step runs apt, and the runner sometimes can't
      # resolve the Ubuntu package servers (it failed this study run and two
      # refreshes). Bounded tries, with a no-deps fallback.
      - run: |
          pip install -r requirements.txt playwright==1.47.0
          timeout 180 python -m playwright install --with-deps chromium || timeout 120 python -m playwright install chromium

      - name: Build the current page code (no odds pulled)
        run: python run.py --skip-odds --skip-weather --skip-coverage

      - name: Download the saved boards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p boards
          days=14; [ -n "${{ inputs.study_weeks }}" ] && days=35
          since=$(date -u -d "$days days ago" +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            -q '.artifacts[] | select(.name | startswith("board-")) | select(.expired | not) | "\(.id) \(.created_at)"' |
            awk -v s="$since" '$2 > s' | while read -r id created; do
              d="boards/$(echo "$created" | tr ':' '-')"
              mkdir -p "$d"
              gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "$d/a.zip" && unzip -q -o "$d/a.zip" -d "$d" && rm -f "$d/a.zip"
            done
          echo "Downloaded $(ls boards | wc -l) boards"

      - name: Real-line study
        if: ${{ inputs.study_weeks != '' }}
        run: python scripts/real_line_study.py --template output/dashboard.html --boards boards --weeks ${{ inputs.study_weeks }}

      - name: Grade the week
        if: ${{ inputs.study_weeks == '' }}
        env:
          WEEK_IN: ${{ inputs.week }}
        run: |
          current=$(grep -o '^const WEEK = [0-9]*' output/dashboard.html | grep -o '[0-9]*$')
          python scripts/lookback.py --template output/dashboard.html --boards boards --week "${WEEK_IN:-$((current - 1))}"
